
name: Innova Contribution Car

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  generate-car:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Innova car
        run: node scripts/generate-car.mjs
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}

      - name: Commit generated car
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/innova-contribution-car.svg
          git diff --cached --quiet || (
            git commit -m "Update Innova contribution car"
            git push
          )
